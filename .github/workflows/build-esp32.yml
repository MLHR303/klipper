name: Build Klipper ESP32

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-esp32.yml'
      - 'src/**'
      - 'lib/**'
      - 'klippy/**'
      - 'Makefile'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Klipper
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            python3-venv \
            git \
            wget \
            curl \
            unzip \
            libffi-dev \
            libssl-dev

      - name: Set up ESP32 toolchain
        run: |
          mkdir -p $HOME/esp
          cd $HOME/esp

          if [ ! -d "xtensa-esp32-elf" ]; then
            wget -q https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
            tar -xzf xtensa-esp32-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
          fi

          echo "$HOME/esp/xtensa-esp32-elf/bin" >> $GITHUB_PATH
          xtensa-esp32-elf-gcc --version

      - name: Configure Klipper for ESP32
        working-directory: ${{ github.workspace }}
        run: |
          make clean
          cat > .config <<EOF
          CONFIG_MCU="esp32"
          CONFIG_MCU_ESP32=y
          CONFIG_BOARD_DIRECT_PINS=y
          CONFIG_USB_SERIAL=y
          EOF
          make olddefconfig

      - name: Build
        working-directory: ${{ github.workspace }}
        run: |
          make -j$(nproc)

      - name: Upload ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: klipper-esp32-firmware
          path: |
            out/klipper.bin
            out/firmware.bin
