name: Build Klipper ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Klipper
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/esp/esp-idf
          key: ${{ runner.os }}-esp-idf-v5.3

      - name: Setup ESP-IDF
        run: |
          if [ ! -d "$HOME/esp/esp-idf" ]; then
            mkdir -p ~/esp
            cd ~/esp
            git clone --recursive https://github.com/espressif/esp-idf.git
            cd esp-idf
            git checkout release/v5.3
          else
            cd ~/esp/esp-idf
            git fetch --all --tags
            git checkout release/v5.3
            git pull
            git submodule update --init --recursive
          fi
          cd ~/esp/esp-idf
          ./install.sh esp32
          
      - name: Build Klipper for ESP32
        run: |
          . ~/esp/esp-idf/export.sh
          cd ${{ github.workspace }}
          ./scripts/build-esp32.sh

      - name: Find and Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: klipper-esp32-firmware
          path: |
            ${{ github.workspace }}/build/klipper-esp32.bin
            ${{ github.workspace }}/out/klipper.bin
